name: Publish Radar Canarinho

on:
  push:
    branches:
      - main
    paths:
      - publish-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download approved HTML from Google Drive
        run: |
          curl -L --fail --retry 3 "https://drive.usercontent.google.com/download?id=1gBkAP-QEq_vqBj2A_UrwRsT4r95nRozT&export=download&confirm=t" -o index.html
          test -s index.html
          grep -qi '<!doctype html' index.html
          grep -qi 'Radar Brasil 2030' index.html

      - name: Publish to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No site change to publish."
            exit 0
          fi
          git commit -m "Publish Radar Canarinho"
          git push
